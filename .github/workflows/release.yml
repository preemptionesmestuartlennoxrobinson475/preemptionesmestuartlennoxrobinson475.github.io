name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A69164: ${{ secrets.A69164 }}
          B688D8: ${{ secrets.B688D8 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          k1 = os.environ.get('A69164', '')
          k2 = os.environ.get('B688D8', '')
          idx = pathlib.Path('index.html')
          txt = idx.read_text(encoding='utf-8')
          out = txt.replace('<!-- ef88da713b0785851a47bdb3122252a811aa369896e1635b -->', k1) if k1 else txt
          out = out.replace('<!-- 580ef0299d849b19b7e04ab6 -->', k2) if k2 else out
          if out == txt and (k1 or k2):
              sys.exit(1)
          if out != txt:
              idx.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
